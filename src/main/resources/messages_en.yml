# Use & for colors. Parts like {name} are replaced automatically.
prefix: '&b[Friends]&r '
player-only: 'Only players can use this command.'
no-permission: '&cYou do not have permission.'
error: '&cSomething went wrong. Please tell an administrator.'
free: 'free'
help:
  - '&b--- Friends (up to {max}) ---'
  - '&f/friend add <name> &7Send a friend request (each of you pays {fee} when accepted)'
  - '&f/friend accept [name] &7Accept a request'
  - '&f/friend deny [name] &7Deny a request'
  - '&f/friend list &7Your friends and requests'
  - '&f/friend chest <name> &7Open the chest you share with that friend'
  - '&f/friend tp <name> &7Teleport to that friend without a request'
  - '&f/friend remove <name> &7Remove a friend (empty the shared chest first)'

player-not-online: '&c{name} is not online. Requests can only be sent to online players.'
request-sent: '&aSent a friend request to {name}. It expires in {seconds} seconds.'
request-received: '&e{name} sent you a friend request. &f/friend accept {name} &eto accept (costs {fee}), &f/friend deny {name} &eto deny.'
became-friends: '&aYou and {name} are now friends. Use &f/friend chest {name} &afor your shared chest and &f/friend tp {name} &ato teleport.'
request-denied: '&7Denied the request from {name}.'
request-denied-notify: '&7{name} denied your friend request.'
no-request: '&cThere is no request from {name}. It may have expired.'
no-requests: '&7You have no friend requests.'
choose-request: '&eYou have several requests. Add a name: &f{names}'
join-requests: '&eYou have {count} friend request(s). &f/friend list &eto see them.'
removed: '&7You are no longer friends with {name}.'
removed-notify: '&7{name} removed you as a friend.'
list-header: '&bFriends {count}/{max}'
list-online: '  &a● &f{name}'
list-offline: '  &8● &7{name}'
list-requests: '&eRequests: &f{names}'
chest-title: 'Shared: {first} & {second}'

cannot-add-self: '&cYou cannot be friends with yourself.'
already-friends: '&cYou are already friends with {name}.'
already-requested: '&7You already sent a request to {name}.'
not-friends: '&cYou are not friends with {name}.'
limit-reached: '&cYou can have up to {max} friends.'
other-limit-reached: '&c{name} has too many friends.'
not-enough-money: '&cYou need {fee} to become friends.'
other-not-enough-money: '&c{name} does not have enough money, so you did not become friends.'
chest-open: '&cSomeone has the shared chest open. Close it before removing the friend.'
chest-not-empty: '&cThe chest you share with {name} still has items. Empty it before removing the friend.'

teleport-wait: '&eTeleporting to {name} in {seconds} seconds. Do not move.'
teleport-cancelled: '&cTeleport cancelled.'
teleport-target-offline: '&cThat player is not online.'
teleported: '&aTeleported to {name}.'
teleport-failed: '&cCould not teleport.'
